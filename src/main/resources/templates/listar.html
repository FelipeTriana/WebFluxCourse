<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}"></title>
</head>
<body>
<div th:if="${param.error != null}" th:text="${param.error}"></div>
<div th:if="${param.success != null}" th:text="${param.success}"></div>


<h1 th:text="${titulo}"></h1>
<a th:href="@{/form}">crear +</a>
<table>
    <thead>
    <tr>
        <th>id</th>
        <th>nombre</th>
        <th>precio</th>
        <th>fecha</th>
        <th>categoría</th>
        <th>editar</th>
        <th>eliminar</th>
    </tr>
    </thead>
    <tbody>
    <!-- Se estan usando los helpers strings de thymeleaft en los th:text para abreviar el id, hacer que coincida el formato del precio con la zona y formatear la fecha-->
    <tr th:each="producto: ${productos}"> <!-- Se muestra cada item que emite el observable y por debajo thymeleaf llama a los getter y setter -->
        <td><a th:href="@{/ver/} + ${producto.id}" th:text="${#strings.abbreviate(producto.id, 10)}"></a></td>
        <td th:text="${producto.nombre}"></td>
        <td th:text="${#numbers.formatCurrency(producto.precio)}"></td>
        <td th:text="${#calendars.format(producto.createAt, 'dd/MM/yyyy')}"></td>
        <td th:text="${producto.categoria.nombre}"></td>
        <td><a th:href="@{/form/} + ${producto.id}">editar</a></td>
        <td><a th:href="@{/eliminar/} + ${producto.id}" onclick="return confirm('¿Estas seguro que deseas eliminar?')">eliminar</a></td>

    </tr>
    </tbody>
</table>
</body>
</html>
